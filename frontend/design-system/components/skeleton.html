<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skeleton Loading - Planejix Design System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #0f0f14; color: #fff; padding: 24px; }
  h2 { font-size: 14px; font-weight: 600; color: #818cf8; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.05em; }
  h3 { font-size: 11px; font-weight: 500; color: #666; margin-bottom: 8px; margin-top: 24px; text-transform: uppercase; letter-spacing: 0.04em; }

  .skeleton {
    background: rgba(37,37,53,0.6); border-radius: 8px;
    animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-skel { border-radius: 16px; padding: 20px; background: #1a1a24; border: 1px solid #32324a; }

  .table-skel { background: #1a1a24; border: 1px solid #32324a; border-radius: 12px; overflow: hidden; }
  .table-header { padding: 12px 20px; border-bottom: 1px solid #32324a; display: flex; gap: 24px; }
  .table-row { padding: 16px 20px; border-bottom: 1px solid rgba(37,37,53,0.5); display: flex; gap: 24px; align-items: center; }
  .table-row:last-child { border-bottom: none; }

  .card-skel {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px; padding: 20px;
  }

  .meta { font-size: 10px; color: #555; margin-top: 16px; }
</style>
</head>
<body>
  <h2>Skeleton Loading</h2>

  <h3>Dashboard KPI Skeletons</h3>
  <div class="stat-grid">
    <div class="stat-skel">
      <div class="skeleton" style="width:80px;height:14px;margin-bottom:8px"></div>
      <div class="skeleton" style="width:120px;height:28px;margin-bottom:8px"></div>
      <div class="skeleton" style="width:60px;height:20px;border-radius:99px"></div>
    </div>
    <div class="stat-skel">
      <div class="skeleton" style="width:70px;height:14px;margin-bottom:8px"></div>
      <div class="skeleton" style="width:100px;height:28px;margin-bottom:8px"></div>
      <div class="skeleton" style="width:50px;height:20px;border-radius:99px"></div>
    </div>
  </div>

  <h3>Chart Skeleton</h3>
  <div class="skeleton" style="width:100%;height:180px;border-radius:12px;margin-bottom:4px"></div>

  <h3>Table Skeleton</h3>
  <div class="table-skel">
    <div class="table-header">
      <div class="skeleton" style="width:80px;height:14px"></div>
      <div class="skeleton" style="width:160px;height:14px"></div>
      <div class="skeleton" style="width:100px;height:14px"></div>
      <div class="skeleton" style="width:60px;height:14px"></div>
    </div>
    <div class="table-row">
      <div class="skeleton" style="width:80px;height:14px"></div>
      <div class="skeleton" style="width:160px;height:14px"></div>
      <div class="skeleton" style="width:100px;height:14px"></div>
      <div class="skeleton" style="width:80px;height:14px"></div>
    </div>
    <div class="table-row">
      <div class="skeleton" style="width:60px;height:14px"></div>
      <div class="skeleton" style="width:140px;height:14px"></div>
      <div class="skeleton" style="width:90px;height:14px"></div>
      <div class="skeleton" style="width:70px;height:14px"></div>
    </div>
    <div class="table-row">
      <div class="skeleton" style="width:70px;height:14px"></div>
      <div class="skeleton" style="width:120px;height:14px"></div>
      <div class="skeleton" style="width:80px;height:14px"></div>
      <div class="skeleton" style="width:90px;height:14px"></div>
    </div>
  </div>

  <h3>Savings Card Skeleton</h3>
  <div class="card-skel" style="display:flex;gap:20px;align-items:center">
    <div class="skeleton" style="width:80px;height:80px;border-radius:50%;flex-shrink:0"></div>
    <div style="flex:1">
      <div class="skeleton" style="width:120px;height:16px;margin-bottom:10px"></div>
      <div class="skeleton" style="width:100px;height:20px;margin-bottom:10px"></div>
      <div class="skeleton" style="width:90px;height:14px"></div>
    </div>
  </div>

  <div class="meta">animate-pulse 2s infinite · background: dark-700/60 · border-radius: 8px (default), 99px (badges), 50% (circles)</div>
</body>
</html>
