<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colors - Planejix Design System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #0f0f14; color: #fff; padding: 24px; }
  h2 { font-size: 14px; font-weight: 600; color: #818cf8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  h3 { font-size: 12px; font-weight: 500; color: #999; margin-bottom: 8px; margin-top: 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch {
    width: 72px; height: 72px; border-radius: 12px; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end; padding: 6px; font-size: 9px; font-weight: 500;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .swatch span { opacity: 0.8; }
  .swatch .name { font-weight: 600; opacity: 1; margin-bottom: 2px; }
</style>
</head>
<body>
  <h2>Paleta de Cores</h2>

  <h3>Brand (Indigo)</h3>
  <div class="row">
    <div class="swatch" style="background:#a5b4fc;color:#1a1a24"><span class="name">300</span><span>#a5b4fc</span></div>
    <div class="swatch" style="background:#818cf8;color:#1a1a24"><span class="name">400</span><span>#818cf8</span></div>
    <div class="swatch" style="background:#6366f1;color:#fff"><span class="name">500</span><span>#6366f1</span></div>
    <div class="swatch" style="background:#4f46e5;color:#fff"><span class="name">600</span><span>#4f46e5</span></div>
  </div>

  <h3>Dark (Background)</h3>
  <div class="row">
    <div class="swatch" style="background:#44445e;color:#fff"><span class="name">500</span><span>#44445e</span></div>
    <div class="swatch" style="background:#32324a;color:#fff"><span class="name">600</span><span>#32324a</span></div>
    <div class="swatch" style="background:#252535;color:#fff"><span class="name">700</span><span>#252535</span></div>
    <div class="swatch" style="background:#1a1a24;color:#fff"><span class="name">800</span><span>#1a1a24</span></div>
    <div class="swatch" style="background:#0f0f14;color:#fff"><span class="name">900</span><span>#0f0f14</span></div>
  </div>

  <h3>Semânticas</h3>
  <div class="row">
    <div class="swatch" style="background:#22c55e;color:#fff"><span class="name">Success</span><span>#22c55e</span></div>
    <div class="swatch" style="background:#ef4444;color:#fff"><span class="name">Danger</span><span>#ef4444</span></div>
    <div class="swatch" style="background:#f59e0b;color:#1a1a24"><span class="name">Warning</span><span>#f59e0b</span></div>
    <div class="swatch" style="background:#3b82f6;color:#fff"><span class="name">Info</span><span>#3b82f6</span></div>
  </div>
</body>
</html>
