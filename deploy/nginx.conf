# Substitua SEU-SUBDOMINIO pelo seu subdomínio DuckDNS
# Ex: api-planejix.duckdns.org
#
# Coloque este arquivo em: /etc/nginx/sites-available/planejix
# Depois execute: sudo ln -s /etc/nginx/sites-available/planejix /etc/nginx/sites-enabled/
# E depois: sudo certbot --nginx -d SEU-SUBDOMINIO

server {
    listen 80;
    server_name SEU-SUBDOMINIO.duckdns.org;

    location /api/ {
        proxy_pass http://localhost:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
